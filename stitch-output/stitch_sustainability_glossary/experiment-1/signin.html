<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign In | Greentryst Academy</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
<script>
tailwind.config = {
  theme: {
    extend: {
      fontFamily: { display: ['Manrope', 'sans-serif'], body: ['Inter', 'sans-serif'] },
      colors: {
        primary: { DEFAULT: '#00433d', light: '#005c55', container: '#006a63', fixed: '#a7f0e6', dim: '#8cd4ca' },
        surface: { DEFAULT: '#f8faf9', dim: '#d8dada', container: '#eceeed', 'container-low': '#f2f4f3', 'container-high': '#e6e9e8', 'container-highest': '#e1e3e2', 'container-lowest': '#ffffff' },
        on: { surface: '#191c1c', 'surface-variant': '#3f4947', primary: '#ffffff' },
        outline: { DEFAULT: '#6f7977', variant: '#bec9c6' },
      }
    }
  }
}
</script>
<style>
* { font-family: 'Inter', sans-serif; }
h1, h2, h3, h4, h5, h6, .font-display { font-family: 'Manrope', sans-serif; }
.vines-gradient { background: linear-gradient(135deg, #00433d 0%, #006a63 100%); }
.hero-gradient { background: linear-gradient(135deg, #00433d 0%, #005c55 40%, #006a63 100%); }
.glass-light { background: rgba(255,255,255,0.8); backdrop-filter: blur(20px); }
.material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
</style>
</head>
<body class="bg-surface-container-low min-h-screen">

<header class="sticky top-0 z-50 glass-light border-b border-outline-variant/20">
  <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
    <a href="index.html" class="flex items-center gap-3 group">
      <div class="w-8 h-8 rounded-lg vines-gradient flex items-center justify-center shadow-sm"><span class="material-symbols-outlined text-white text-lg">eco</span></div>
      <span class="font-display font-bold text-on-surface text-lg tracking-tight">Greentryst</span>
    </a>
    <a href="index.html" class="text-sm font-medium text-on-surface-variant hover:text-on-surface transition">Back to Home</a>
  </div>
</header>

<main class="min-h-[calc(100vh-4rem)] flex items-center justify-center px-4 py-12">
  <div class="bg-surface-container-lowest rounded-2xl p-10 shadow-lg w-full max-w-md">
    <div class="flex flex-col items-center mb-8">
      <div class="w-12 h-12 rounded-xl vines-gradient flex items-center justify-center shadow-sm mb-4">
        <span class="material-symbols-outlined text-white text-2xl">eco</span>
      </div>
      <h1 class="font-display text-2xl font-extrabold text-on-surface mb-1">Welcome back</h1>
      <p class="text-sm text-on-surface-variant">Sign in to continue your learning journey</p>
    </div>

    <form class="space-y-4" onsubmit="event.preventDefault()">
      <div>
        <label class="block text-sm font-medium text-on-surface-variant mb-1.5">Email</label>
        <input type="email" placeholder="you@example.com" class="w-full rounded-xl bg-surface-container-low border-none py-3.5 px-5 text-sm text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-primary/30 transition" />
      </div>

      <div>
        <label class="block text-sm font-medium text-on-surface-variant mb-1.5">Password</label>
        <div class="relative">
          <input id="password-input" type="password" placeholder="Enter your password" class="w-full rounded-xl bg-surface-container-low border-none py-3.5 px-5 pr-12 text-sm text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-primary/30 transition" />
          <button type="button" onclick="togglePassword()" class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface transition">
            <span id="visibility-icon" class="material-symbols-outlined text-xl">visibility_off</span>
          </button>
        </div>
      </div>

      <div class="flex justify-end">
        <a href="#" class="text-sm text-primary font-medium hover:text-primary-light transition">Forgot password?</a>
      </div>

      <button type="submit" class="w-full vines-gradient text-white font-bold py-3.5 rounded-full hover:opacity-90 transition shadow-sm text-sm">
        Sign In
      </button>
    </form>

    <div class="flex items-center gap-4 my-6">
      <div class="flex-1 h-px bg-outline-variant/30"></div>
      <span class="text-xs text-outline font-medium">or</span>
      <div class="flex-1 h-px bg-outline-variant/30"></div>
    </div>

    <button class="w-full flex items-center justify-center gap-3 bg-surface-container-low rounded-full py-3.5 text-sm font-semibold text-on-surface hover:bg-surface-container transition">
      <svg class="w-5 h-5" viewBox="0 0 24 24">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Continue with Google
    </button>

    <p class="text-center text-sm text-on-surface-variant mt-6">
      Don't have an account? <a href="#" class="text-primary font-semibold hover:text-primary-light transition">Sign up</a>
    </p>
  </div>
</main>

<div id="search-modal" class="hidden fixed inset-0 z-[100] flex items-start justify-center pt-[15vh]">
  <div class="absolute inset-0 bg-black/40 backdrop-blur-sm" onclick="document.getElementById('search-modal').classList.add('hidden')"></div>
  <div class="relative bg-surface-container-lowest rounded-2xl shadow-2xl w-full max-w-xl mx-4 overflow-hidden">
    <div class="flex items-center gap-3 px-5 py-4 border-b border-outline-variant/20">
      <span class="material-symbols-outlined text-on-surface-variant">search</span>
      <input type="text" placeholder="Search courses, lessons, glossary..." class="flex-1 bg-transparent text-on-surface text-base outline-none placeholder:text-outline" autofocus />
      <kbd class="text-xs text-outline bg-surface-container px-2 py-1 rounded">Esc</kbd>
    </div>
    <div class="p-4 space-y-1">
      <a href="glossary.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-surface-container-low transition"><span class="material-symbols-outlined text-primary text-sm">menu_book</span><div><p class="text-sm font-semibold text-on-surface">Carbon Credit</p><p class="text-xs text-on-surface-variant">Glossary term</p></div></a>
      <a href="lesson.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-surface-container-low transition"><span class="material-symbols-outlined text-primary text-sm">description</span><div><p class="text-sm font-semibold text-on-surface">The Glasgow Rulebook</p><p class="text-xs text-on-surface-variant">Article 6 - Module 1, Lesson 3</p></div></a>
    </div>
  </div>
</div>
<script>
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); document.getElementById('search-modal').classList.remove('hidden'); }
  if (e.key === 'Escape') document.getElementById('search-modal').classList.add('hidden');
});

function togglePassword() {
  const input = document.getElementById('password-input');
  const icon = document.getElementById('visibility-icon');
  if (input.type === 'password') {
    input.type = 'text';
    icon.textContent = 'visibility';
  } else {
    input.type = 'password';
    icon.textContent = 'visibility_off';
  }
}
</script>

</body>
</html>
