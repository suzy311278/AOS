<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Greentryst LinkedIn Banner</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    .banner {
      width: 1584px;
      height: 396px;
      background: #081C15;
      position: relative;
      overflow: hidden;
      font-family: 'Inter', system-ui, sans-serif;
    }

    /* Gradient glows */
    .glow-1 {
      position: absolute;
      top: -100px;
      left: 20%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(82, 183, 136, 0.25) 0%, transparent 70%);
      border-radius: 50%;
      filter: blur(60px);
    }

    .glow-2 {
      position: absolute;
      bottom: -150px;
      right: 15%;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(45, 106, 79, 0.3) 0%, transparent 70%);
      border-radius: 50%;
      filter: blur(50px);
    }

    .glow-3 {
      position: absolute;
      top: 50%;
      right: 30%;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(82, 183, 136, 0.15) 0%, transparent 70%);
      border-radius: 50%;
      filter: blur(40px);
    }

    /* Dot grid */
    .dot-grid {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255,255,255,0.08) 1px, transparent 1px);
      background-size: 24px 24px;
      opacity: 0.5;
    }

    /* Content */
    .content {
      position: relative;
      z-index: 10;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 80px;
    }

    .left {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .logo {
      font-size: 48px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .logo .green {
      color: #FFFFFF;
    }

    .logo .tryst {
      color: #52B788;
    }

    .tagline {
      font-size: 22px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.7);
      max-width: 500px;
      line-height: 1.4;
    }

    .tagline-highlight {
      color: #52B788;
    }

    .stats {
      display: flex;
      gap: 40px;
      margin-top: 12px;
    }

    .stat {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .stat-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 28px;
      font-weight: 600;
      color: #FFFFFF;
    }

    .stat-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: rgba(255, 255, 255, 0.5);
    }

    /* Right side - rotating taglines preview */
    .right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 12px;
    }

    .tagline-item {
      font-size: 18px;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .tagline-item.active {
      background: rgba(82, 183, 136, 0.15);
      border-color: rgba(82, 183, 136, 0.3);
      color: #52B788;
    }

    .tagline-item.muted {
      color: rgba(255, 255, 255, 0.4);
    }

    /* Floating icons */
    .icon {
      position: absolute;
      color: rgba(255, 255, 255, 0.15);
    }

    .icon-1 { top: 60px; right: 120px; font-size: 32px; }
    .icon-2 { bottom: 80px; right: 200px; font-size: 28px; }
    .icon-3 { top: 100px; left: 45%; font-size: 24px; }
  </style>
</head>
<body>
  <div class="banner">
    <!-- Gradient glows -->
    <div class="glow-1"></div>
    <div class="glow-2"></div>
    <div class="glow-3"></div>

    <!-- Dot grid -->
    <div class="dot-grid"></div>

    <!-- Floating icons (using Unicode symbols) -->
    <div class="icon icon-1">&#x1F331;</div>
    <div class="icon icon-2">&#x1F4CA;</div>
    <div class="icon icon-3">&#x1F30D;</div>

    <!-- Content -->
    <div class="content">
      <div class="left">
        <div class="logo">
          <span class="green">Green</span><span class="tryst">tryst</span>
        </div>
        <div class="tagline">
          The professional operating system for <span class="tagline-highlight">sustainability</span>.
        </div>
        <div class="stats">
          <div class="stat">
            <span class="stat-value">22+</span>
            <span class="stat-label">Courses</span>
          </div>
          <div class="stat">
            <span class="stat-value">470+</span>
            <span class="stat-label">Lessons</span>
          </div>
          <div class="stat">
            <span class="stat-value">80+</span>
            <span class="stat-label">Source PDFs</span>
          </div>
        </div>
      </div>

      <div class="right">
        <div class="tagline-item active">Learn any framework.</div>
        <div class="tagline-item muted">Find any answer.</div>
        <div class="tagline-item muted">Run any calculation.</div>
        <div class="tagline-item muted">Land your next role.</div>
      </div>
    </div>
  </div>
</body>
</html>
