# The `status` field on a pillar controls rendering:
#   live        — full page with all disclosures.
#   in_progress — page 404s; card shows "In preparation" on the overview.
pillars:
  - id: governance
    name: Governance
    slug: governance
    order: 1
    summary: >
      How oversight of climate-related risks and opportunities is
      organised, resourced, informed, and factored into strategic
      decision-making at board and management level. Covers paragraphs 6
      and 7.
    paragraph_refs:
      - "6(a)"
      - "6(a)(i)"
      - "6(a)(ii)"
      - "6(a)(iii)"
      - "6(a)(iv)"
      - "6(a)(v)"
      - "6(b)"
      - "6(b)(i)"
      - "6(b)(ii)"
      - "7"
    status: live
  - id: strategy
    name: Strategy
    slug: strategy
    order: 2
    summary: >
      Climate-related risks and opportunities, their effects on the
      business model and value chain, strategic response and transition
      plans, financial effects over the short, medium, and long term,
      and climate resilience under scenario analysis. Covers paragraphs
      9 through 23.
    paragraph_refs: []
    status: live
  - id: risk-management
    name: Risk Management
    slug: risk-management
    order: 3
    summary: >
      The processes used to identify, assess, prioritise, and monitor
      climate-related risks and opportunities, and how those processes
      are integrated into enterprise risk management. Covers paragraphs
      25 and 26.
    paragraph_refs: []
    status: live
  - id: metrics-and-targets
    name: Metrics and Targets
    slug: metrics-and-targets
    order: 4
    summary: >
      Cross-industry metric categories including Scope 1, 2, and 3
      greenhouse gas emissions, transition and physical risk exposure,
      climate-related opportunities, capital deployment, internal carbon
      prices, and remuneration linkages. Industry-based metrics and
      climate-related targets. Covers paragraphs 28 through 37.
    paragraph_refs: []
    status: live
