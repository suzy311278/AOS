summary: >
  IFRS S2 Climate-related Disclosures is the global baseline standard for
  corporate climate reporting. Issued by the International Sustainability
  Standards Board (ISSB) under the IFRS Foundation in June 2023 and
  effective for annual reporting periods beginning on or after 1 January
  2024, it has since been adopted or formally referenced by regulators
  in the United Kingdom, Australia, Canada, Brazil, Japan, Singapore,
  and Nigeria. With that global footprint, IFRS S2 is now the de facto
  successor to the TCFD recommendations.

long_summary: >
  The International Sustainability Standards Board issued IFRS S2 in
  June 2023 alongside IFRS S1 General Requirements for Disclosure of
  Sustainability-related Financial Information. The two standards form
  the first pair of IFRS Sustainability Disclosure Standards. IFRS S2
  absorbs and replaces the TCFD framework, carries forward the same four
  pillars, and adds quantitative and industry-based metric requirements
  drawn from the SASB Standards. Adoption is being introduced in
  jurisdictions on a staggered basis, typically beginning with listed
  issuers and financial institutions.

