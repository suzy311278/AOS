title: "IEC 62443 Security Maintenance & Operations"
shortTitle: "Maintenance"
subtitle: "Patch management, monitoring, incident response, and ongoing compliance for industrial environments."
tagline: "Secure systems stay secure only if you maintain them."
summary: >
  Learn the operational side of IEC 62443: patch management under plant
  constraints, continuous monitoring with OT-aware SIEM, incident-response
  playbooks for ICS, and audit-readiness for 62443-2-1 programme
  requirements. The lab simulates a patching cycle on a live PLC network.
description: >
  Maintenance Specialist track for the ArmorInnovate IEC 62443 program.
  Covers IEC 62443-2-3 (patch management), IEC 62443-2-4 (service provider
  requirements), and the operational practices mandated by IEC 62443-2-1.
  Includes monitoring architectures, incident-response planning specific to
  safety-critical environments, and a hands-on lab running a patching cycle
  on simulated Siemens S7 controllers.
