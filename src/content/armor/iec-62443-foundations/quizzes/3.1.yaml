- question: "How many Foundational Requirements (FRs) does IEC 62443 define?"
  options:
    - "Three"
    - "Five"
    - "Seven"
    - "Ten"
  answer: 2
  explanation: "IEC 62443 defines seven Foundational Requirements: FR 1 (IAC), FR 2 (UC), FR 3 (SI), FR 4 (DC), FR 5 (RDF), FR 6 (TRE), FR 7 (RA). Every system requirement in 3-3 and component requirement in 4-2 maps to one of these seven."

- question: "What is a Security Level (SL) vector?"
  options:
    - "A single number from 1 to 4 that represents overall security."
    - "A vector of seven values — one per Foundational Requirement — each ranging from 0 to 4."
    - "A list of all vulnerabilities in a zone."
    - "A prioritised list of security controls."
  answer: 1
  explanation: "An SL is not a single number but a vector of seven values, one for each FR. The overall SL of a zone is the minimum across all seven elements — the chain is only as strong as its weakest link."

- question: "What is the difference between SL-T, SL-C, and SL-A?"
  options:
    - "SL-T is for testing, SL-C is for certification, SL-A is for auditing."
    - "SL-T is the target based on risk assessment, SL-C is what the system can achieve by design, SL-A is what is actually achieved after deployment."
    - "They are three different scales for measuring security."
    - "SL-T applies to systems, SL-C to components, SL-A to applications."
  answer: 1
  explanation: "SL-T (Target) is derived from risk assessment — what you need. SL-C (Capability) is what the system can achieve based on its design. SL-A (Achieved) is what the system actually provides after deployment. The gap between SL-T and SL-A is your residual risk."
