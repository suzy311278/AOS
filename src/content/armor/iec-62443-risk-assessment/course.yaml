summary: >
  Master the IEC 62443-3-2 risk-assessment methodology end-to-end. You will
  partition a reference plant into security zones, model conduits, identify
  threat actors, and assign target security levels. The course closes with
  a risk-register workshop that mirrors a real site assessment.
description: >
  Risk Assessment Specialist track for the ArmorInnovate IEC 62443 program.
  Covers zone and conduit partitioning, detailed risk analysis using the
  62443-3-2 methodology, threat-actor capability mapping, tolerable risk
  thresholds, and the derivation of target SL-T values. Includes a capstone
  risk-register exercise against a reference water-treatment plant.
