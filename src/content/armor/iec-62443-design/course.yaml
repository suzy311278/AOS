  - "Design a defence-in-depth network with proper IDMZ placement."
  - "Specify component-level security per IEC 62443-4-2."
  - "Apply secure development lifecycle gates from IEC 62443-4-1."
  - "Deploy and validate a segmented OT reference architecture in a lab."
