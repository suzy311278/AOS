id: iec-62443-design
code: AI-CSP-DSN
title: "IEC 62443 Secure System Design"
shortTitle: "Design"
subtitle: "Translate security levels into architecture: network segmentation, component hardening, and secure development."
tagline: "Design systems that resist compromise by construction."
summary: >
  Learn how to translate SL-T targets into concrete system architecture
  decisions. Covers network segmentation patterns, IEC 62443-3-3 system
  requirements, IEC 62443-4-2 component requirements, and secure SDLC
  practices from 62443-4-1. The capstone lab deploys a segmented reference
  architecture on a virtual OT network.
description: >
  Design Specialist track for the ArmorInnovate IEC 62443 program. This
  course bridges the gap between risk assessment output and procurement /
  engineering specifications. Covers defence-in-depth topologies, firewall
  and IDMZ design, component-level hardening per 62443-4-2, and the
  secure development lifecycle per 62443-4-1. Ends with a hands-on lab
  deploying a compliant reference architecture.
