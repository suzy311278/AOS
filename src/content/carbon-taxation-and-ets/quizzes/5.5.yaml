- question: "What was the main price problem in EU ETS Phase 3 (2013-2020)?"
  options:
    - "Prices were too high"
    - "Large surplus of allowances depressed prices below levels needed for investment"
    - "Prices were perfectly stable"
    - "No one could buy allowances"
  answer: 1
  explanation: "EU ETS accumulated a large surplus of allowances (over 2 billion), depressing prices and undermining the incentive for low-carbon investment. This led to the creation of the Market Stability Reserve."

- question: "How does the EU's Market Stability Reserve address surplus allowances?"
  options:
    - "It destroys all allowances"
    - "It automatically removes allowances from auctions when the surplus exceeds a threshold"
    - "It gives allowances away for free"
    - "It sells surplus to other countries"
  answer: 1
  explanation: "The MSR removes 12-24% of allowances from auctions annually when the surplus exceeds 833 million allowances, and can return them when surplus is low, stabilizing supply."

- question: "What is California's Allowance Price Containment Reserve?"
  options:
    - "A fund to buy back allowances"
    - "A tiered reserve that releases allowances at progressively higher price triggers"
    - "A tax on allowances"
    - "A floor price mechanism"
  answer: 1
  explanation: "California's reserve has multiple tiers that release allowances at different price levels (e.g., $60, $65, $70), creating a graduated ceiling that moderates price spikes."

- question: "What happened in RGGI when allowance prices stayed near the floor?"
  options:
    - "The system was cancelled"
    - "The floor was raised and the cap was tightened to restore scarcity"
    - "All allowances were given away"
    - "Nothing changed"
  answer: 1
  explanation: "When RGGI prices sat at the floor for years, regulators raised the floor price and tightened the cap to restore scarcity and meaningful carbon prices, demonstrating adaptive management."
