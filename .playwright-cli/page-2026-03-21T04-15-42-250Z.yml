        - article [ref=e109]:
          - heading "The Final Piece of the Puzzle" [level=2] [ref=e110]
          - paragraph [ref=e111]: For six years following the Paris Agreement in 2015, the operational details of Article 6 remained the most contentious part of the international climate negotiation process. It wasn't until COP26 in Glasgow that countries finally reached a consensus, establishing what is now known as the **Glasgow Rulebook**.
          - generic [ref=e112]:
            - generic [ref=e113]:
              - generic [ref=e114]: lightbulb
              - generic [ref=e115]: Key Takeaway
            - paragraph [ref=e116]: The Glasgow Rulebook ensures that carbon credits cannot be counted twice—once by the country selling them and once by the country buying them—a mechanism known as "Corresponding Adjustments".
          - paragraph [ref=e117]: This agreement provides the necessary accounting frameworks for international cooperation. Before Glasgow, there was a significant risk of double-counting, which would have undermined the atmospheric integrity of the entire Paris Agreement.
          - heading "The Three Pillars of Implementation" [level=2] [ref=e118]
          - list [ref=e119]:
            - listitem [ref=e120]:
              - generic [ref=e121]: check_circle
              - generic [ref=e122]:
                - strong [ref=e123]: Article 6.2 (Bilateral Cooperation)
                - text: Allows for the direct transfer of carbon credits between countries.
            - listitem [ref=e124]:
              - generic [ref=e125]: check_circle
              - generic [ref=e126]:
                - strong [ref=e127]: Article 6.4 (The Mechanism)
                - text: Creates a global carbon market overseen by a UN body.
            - listitem [ref=e128]:
              - generic [ref=e129]: check_circle
              - generic [ref=e130]:
                - strong [ref=e131]: Article 6.8 (Non-market approaches)
                - text: Facilitates cooperation through finance, technology transfer, and capacity building.
          - generic [ref=e132]:
            - generic [ref=e134]: compare_arrows
            - generic [ref=e135]:
              - generic [ref=e136]: Analogy
              - paragraph [ref=e137]: Think of the Glasgow Rulebook as the international banking software for carbon. Without it, every country was using their own handwritten ledgers that didn't talk to each other, making fraud and errors almost inevitable.
          - paragraph [ref=e138]: Furthermore, the Rulebook established a "Share of Proceeds" for adaptation. For every credit sold under the 6.4 mechanism, 5% of the credits are automatically transferred to a fund for developing nations to deal with climate impacts.
          - generic [ref=e139]:
            - generic [ref=e141]: info
            - generic [ref=e142]:
              - generic [ref=e143]: Example
              - paragraph [ref=e144]: If Switzerland pays for an electric bus fleet in Ghana, the carbon reductions achieved can be credited to Switzerland's national target, provided Ghana makes a corresponding adjustment to their own accounts.
